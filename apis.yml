name: Securden
description: >-
  Securden is a unified identity security platform that consolidates Privileged Access
  Management (PAM), Endpoint Privilege Manager (EPM), a business Password Vault, Identity
  Governance & Administration (IGA), Cloud Infrastructure Entitlement Management (CIEM),
  Non-Human Identity Management, and AI Agent Security into a single architecture. It is
  available on-premises, self-hosted, or as SaaS, and is used by organizations including
  Harvard Medical School, NASA, Shell, and Coca-Cola. For developers and DevOps, Securden
  publishes a token-authenticated Password Retrieval REST API plus official SDKs (JavaScript,
  Go, Java, .NET), a cross-platform CLI, and a Terraform provider to eliminate hardcoded
  credentials in scripts and pipelines. Securden holds SOC 2 Type II and ISO/IEC 27001
  certifications and is GDPR compliant.
