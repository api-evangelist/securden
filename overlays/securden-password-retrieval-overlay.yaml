overlay: 1.0.0
info:
  title: API Evangelist enhancements for Securden Password Retrieval API
  version: 1.0.0
extends: openapi/securden-password-retrieval-openapi.yml
actions:
  - target: $.info
    update:
      description: >-
        Token-authenticated REST API for programmatically retrieving credentials from a
        self-hosted Securden Unified PAM / Password Vault server. Authenticate with an API
        Authentication Token (parameter `authtoken`); dynamic tokens are minted via
        GET /api/get_auth_token.
      contact:
        name: Securden DevOps Support
        email: devops-support@securden.com
      x-apievangelist-auth: apiKey (authtoken)
  - target: $.paths['/get_password'].get
    update:
      operationId: getPassword
      tags: [Passwords]
      summary: Retrieve password information for an account
